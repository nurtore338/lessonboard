<style>
:root{--bg:#ffffff;--card:#f8fafc;--ink:#0f172a;--mu:#64748b;--ln:#e2e8f0;--ac:#0891b2;--ac2:#7c3aed;--g:#059669;--ok:#dcfce7;--bad:#fee2e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.cells{display:flex;gap:6px}

.cells span:nth-child(1){color:var(--ac);border-color:rgba(8,145,178,.45)}

h1{font-size:clamp(30px,6.5vw,48px);line-height:1.25;padding:.04em 0 .2em;margin:14px 0 2px;letter-spacing:-.025em;background:linear-gradient(90deg,#0f172a,var(--ac) 60%,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}

nav{display:flex;gap:6px;margin:16px 0 20px;padding:6px;background:rgba(255,255,255,.72);border:1px solid rgba(15,23,42,.08);border-radius:18px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 4px 18px rgba(15,23,42,.07)}
nav::-webkit-scrollbar{display:none}

nav .thumb{background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 18px rgba(8,145,178,.32);z-index:1}
nav.ready .thumb{transition:transform .55s cubic-bezier(.34,1.5,.5,1),width .55s cubic-bezier(.34,1.5,.5,1)}

@media (hover:hover){nav button:hover{color:var(--ink);transform:scale(1.07)}}

.btn,.chip,.opt,.react{transition:transform .3s cubic-bezier(.34,1.56,.5,1),border-color .15s,box-shadow .15s,background .15s,color .15s}

.reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

@media (hover:hover){.react:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 20px rgba(15,23,42,.1)}.react.on:hover{transform:scale(1.08)}.reacts.has .react:not(.on):hover{opacity:1;filter:none}}
.react:active{transform:scale(.94)}
.react{min-height:124px;justify-content:flex-end}
.react .e{display:flex;align-items:center;justify-content:center;height:66px;font-size:40px;line-height:1;transition:font-size .45s cubic-bezier(.34,1.56,.5,1)}
.react .l{font:600 13px system-ui,sans-serif;color:var(--mu)}

.react.love .e.pop{animation:beat .8s ease-out}
.react.hard .e.pop{animation:wob .7s ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.55) rotate(-8deg)}70%{transform:scale(.92) rotate(4deg)}100%{transform:scale(1)}}
@keyframes beat{0%{transform:scale(1)}15%{transform:scale(1.5)}30%{transform:scale(1.05)}45%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg) scale(1.25)}45%{transform:rotate(14deg) scale(1.25)}70%{transform:rotate(-8deg)}}
.pt{position:absolute;left:50%;top:34%;pointer-events:none;z-index:6;opacity:0;animation:fly 1.2s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(-50%,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--r)) scale(1.1)}}

h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin:28px 0 10px;font-family:ui-monospace,Menlo,Consolas,monospace}

.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin:10px 0}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.x{border:0;background:none;color:var(--mu);font-size:20px;cursor:pointer;padding:4px 10px;border-radius:8px}.x:hover{background:var(--bad);color:#dc2626}
label{display:block;font-weight:600;margin:0 0 4px;font-size:15px;color:var(--ink)}

input[type=text]{width:100%;flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink)}
::placeholder{color:#94a3b8}
.btn{font:600 15px system-ui,sans-serif;background:#f1f5f9;color:var(--ink);border:1px solid #cbd5e1;border-radius:10px;padding:11px 18px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.a{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;box-shadow:0 4px 14px rgba(8,145,178,.25)}
.btn.a:hover{filter:brightness(1.08);color:#fff}
details{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin:10px 0;padding:0 16px}
summary{cursor:pointer;font-weight:600;padding:14px 0;font-size:18px}
details[open]{border-color:rgba(8,145,178,.45);background:#fff}
details[open] summary{color:var(--ac)}
details p{margin:0 0 12px}
pre{background:#0f172a;color:#c9f5ff;border-left:3px solid var(--ac);padding:12px 14px;border-radius:10px;overflow-x:auto;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.tag{display:inline-block;font:600 13px ui-monospace,Menlo,monospace;background:var(--ok);color:var(--g);padding:2px 9px;border-radius:99px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;padding:11px 14px;margin:6px 0;border:1px solid #cbd5e1;background:#fff;color:var(--ink);border-radius:10px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--ac2)}

.opt.r{background:var(--ok);border-color:var(--g)}.opt.w{background:var(--bad);border-color:#dc2626}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

.ring{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}

.ring .fg{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:100;opacity:0;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1),stroke .5s,opacity .3s,filter .5s}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.rrows .rrow:nth-child(2) .rb i{transition-delay:.1s}.rrows .rrow:nth-child(3) .rb i{transition-delay:.2s}.rrows .rrow:nth-child(4) .rb i{transition-delay:.3s}
.tg{display:none;font:600 11px ui-monospace,Menlo,monospace;font-style:normal;color:var(--mu);background:#eef2f7;border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.rcap{font-size:13px;color:var(--mu);margin-top:10px}
.gate{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1.5px dashed var(--ac);border-radius:16px;padding:16px 18px;background:var(--card);animation:rise .5s ease both}
.gate-i{font-size:30px;display:inline-block;animation:wig 2.6s ease-in-out infinite;transform-origin:50% 10%}
@keyframes wig{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-14deg)}76%{transform:rotate(12deg)}84%{transform:rotate(-8deg)}92%{transform:rotate(4deg)}}
.gate-t{flex:1;min-width:200px}

.send{position:relative}
.send p{margin:0 0 12px}
.send-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn.a.pulse{animation:glow 2.2s ease-out infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(8,145,178,.5)}70%{box-shadow:0 0 0 14px rgba(8,145,178,0)}100%{box-shadow:0 0 0 0 rgba(8,145,178,0)}}
.st{font-size:15px;color:var(--mu)}
.st.done{display:inline-flex;align-items:center;gap:8px;color:var(--g);font-weight:700;background:var(--ok);padding:7px 14px;border-radius:99px}
.chk{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font-size:12px}
.st.fresh{animation:okpop .6s cubic-bezier(.34,1.56,.5,1)}
@keyframes okpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.cf{position:absolute;width:9px;height:9px;pointer-events:none;z-index:8;animation:cf 1.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.res,.gate,.gate-i,.btn.a.pulse,.st.fresh{animation:none!important}.ring .fg,.rb i{transition:none!important}}

html{-webkit-text-size-adjust:100%}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};

const API="https://script.google.com/macros/s/AKfycbxC5gMuyye-3GtIXP13ocTwgbiwqGFUtGAgEFq_eZr-LnBAWvQnaiAoYymgQdVK6dnB/exec"; // адрес веб-приложения Google Apps Script (заканчивается на /exec)
let reg=load("lb_reg",{name:"",grp:""}),R=load("lb_r",{}),SENT=load("lb_sent",null),TP=load("lb_pin",""),JR=[],JM="";

const DEF={"v": 0, "topic": "Контейнеры", "goals": ["Понять, что такое контейнеры данных и зачем они нужны", "Различать массив, словарь, множество, стек и очередь", "Уверенно подбирать подходящий контейнер для задачи"], "lec": [{"t": "Контейнер: общая идея", "img": "box", "b": "Представьте шкаф с ячейками: вместо десяти разбросанных вещей — одно место, где всё лежит. Контейнер данных — это структура, которая хранит **много значений под одним именем**.\n\nС ним постоянно делают две вещи: смотрят **размер** (сколько элементов внутри) и выполняют **обход** (проходят по элементам один за другим и что-то с ними делают)."}, {"t": "Массив: порядок и индексы", "img": "array", "b": "В массиве (в Python он называется список) элементы выстроены в ряд. У каждого есть свой номер — **индекс**, и по нему сразу достаётся нужное значение.\n\nНумерация начинается с **нуля**. Поэтому в массиве из пяти элементов индексы идут от 0 до 4, а последний элемент имеет индекс 4."}, {"t": "Словарь: ключ и значение", "img": "dict", "b": "Словарь похож на телефонную книгу: есть имя (**ключ**) и номер (**значение**). Чтобы найти номер, не нужно знать место в списке — достаточно назвать ключ.\n\nКлючи не повторяются, а новые пары можно добавлять в любой момент."}, {"t": "Множество: только уникальное", "img": "set", "b": "Множество само убирает повторы: одинаковое значение хранится **только один раз**. Порядок элементов при этом не важен.\n\nЕсли нужно узнать, какие города встречаются в списке, не считая дубликаты, достаточно превратить список в множество."}, {"t": "Стек: последним вошёл — первым вышел", "img": "stack", "b": "Стек работает как стопка тарелок: новую кладём сверху и берём тоже сверху. Это правило **LIFO** — последним пришёл, первым вышел.\n\nПоложили 10, потом 20, потом 30 — первым достанется **30**."}, {"t": "Очередь: первым вошёл — первым вышел", "img": "queue", "b": "Очередь устроена как очередь в магазине: кто встал первым, того и обслужат первым. Это правило **FIFO** — первым пришёл, первым вышел.\n\nПоставили в очередь 10, 20, 30 — первым выйдет **10**."}], "quiz": [{"q": "Что представляет собой контейнер данных?", "o": ["Структуру, в которой хранится набор элементов", "Команду, которая останавливает программу", "Устройство для вывода на экран", "Оператор, проверяющий условие"], "a": 0, "img": "box"}, {"q": "Как достать элемент массива, зная его место в ряду?", "o": ["По цвету", "По названию файла", "По индексу", "По ширине экрана"], "a": 2}, {"q": "Индексы в массиве начинаются с нуля. В массиве из пяти элементов последний индекс — это…", "o": ["5", "1", "6", "4"], "a": 3, "img": "array_n"}, {"q": "Какая структура хранит данные парами «ключ — значение»?", "o": ["Стек", "Словарь", "Очередь", "Множество"], "a": 1}, {"q": "Положили в пустой стек 10, 20 и 30. Какое число достанут первым?", "o": ["10", "20", "30", "Все три сразу"], "a": 2, "img": "stack_n"}, {"q": "Поставили в пустую очередь 10, 20 и 30. Кто выйдет первым?", "o": ["10", "20", "30", "Никто"], "a": 0, "img": "queue_n"}, {"q": "Из списка городов с повторами нужно получить города без дубликатов. Что выбрать?", "o": ["Стек", "Множество", "Очередь", "Обычный массив"], "a": 1, "img": "set_n"}, {"q": "В списке было 6 элементов. Добавили 2 и убрали 1. Сколько элементов теперь?", "o": ["6", "7", "8", "9"], "a": 1}, {"q": "Что верно про множество?", "o": ["В нём можно хранить только строки", "У каждого элемента есть числовой индекс", "Одинаковые значения не хранятся повторно", "Из него нельзя ничего удалять"], "a": 2}, {"q": "Зачем нужны контейнеры данных?", "o": ["Чтобы красиво оформлять текст", "Чтобы хранить и обрабатывать сразу несколько значений", "Чтобы запускать операционную систему", "Чтобы заменить все переменные константами"], "a": 1}, {"q": "Что удобнее всего взять для телефонных номеров, если у каждого контакта есть уникальный код?", "o": ["Стек без ключей", "Очередь без ключей", "Множество кодов без номеров", "Словарь, где код контакта — ключ"], "a": 3, "img": "phones_n"}, {"
