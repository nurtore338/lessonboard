<!DOCTYPE html>
<html lang="ru">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LessonBoard — Вставка видео и аудио в документ HTML</title>
<meta name="theme-color" content="#f5efe6">
<meta name="description" content="LessonBoard: интерактивный урок, конспект, тест и рефлексия">
<meta property="og:title" content="LessonBoard — Вставка видео и аудио в документ HTML">
<meta property="og:description" content="Интерактивный учебный модуль в теплой кофейно-бежевой гамме">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LessonBoard">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E☕%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  /* Warm Coffee & Cream Palette */
  --bg: #f5efe6;            /* Warm Cream Background */
  --card: #ffffff;          /* Ivory / Pure Warm White Card Background */
  --card-border: #e2d7c7;   /* Soft Warm Beige Border */
  --ink: #2c1d11;           /* Deep Espresso / Rich Dark Brown */
  --mu: #6e5949;            /* Muted Coffee Text */
  --ln: #e8ded1;            /* Warm Divider Line */
  
  /* Accent Colors */
  --ac: #b45309;            /* Rich Warm Caramel / Amber Brown */
  --ac-hover: #92400e;
  --ac2: #78350f;           /* Deep Mocha / Chocolate */
  --ac-glow: rgba(180, 83, 9, 0.15);
  
  /* Status Colors */
  --g: #059669;             /* Sage Green Success */
  --ok: rgba(5, 150, 105, 0.1);
  --ok-border: rgba(5, 150, 105, 0.3);
  --bad: rgba(220, 38, 38, 0.1);
  --bad-border: rgba(220, 38, 38, 0.3);
  
  /* Shadow Effects */
  --shadow-sm: 0 2px 5px rgba(61, 43, 31, 0.05);
  --shadow: 0 8px 24px rgba(61, 43, 31, 0.08);
  --shadow-lg: 0 16px 36px rgba(61, 43, 31, 0.12), 0 0 20px var(--ac-glow);
  
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  background: var(--bg);
  background-image: 
    radial-gradient(circle at 12% 12%, rgba(217, 119, 6, 0.06) 0%, transparent 45%),
    radial-gradient(circle at 88% 88%, rgba(120, 53, 15, 0.05) 0%, transparent 45%);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

.mono, code, pre {
  font-family: 'Fira Code', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

/* Main Container with bottom padding for fixed floating navigation */
.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 0 20px 110px;
}

/* Header & Logo */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 0 16px;
}
.logo {
  font-weight: 800;
  font-size: 24px;
  letter-spacing: -0.03em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo::before {
  content: '☕';
  font-size: 22px;
  filter: drop-shadow(0 2px 4px rgba(120, 53, 15, 0.2));
}
.logo b {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Headings */
h1 {
  font-size: clamp(24px, 5.5vw, 38px);
  font-weight: 800;
  line-height: 1.25;
  margin: 16px 0 20px;
  letter-spacing: -0.03em;
  color: var(--ink);
  position: relative;
  padding-left: 18px;
}
h1::before {
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 6px;
  width: 5px;
  background: linear-gradient(180deg, var(--ac), var(--ac2));
  border-radius: 99px;
  box-shadow: 0 0 10px rgba(180, 83, 9, 0.3);
}

h2 {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ac);
  margin: 32px 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
h2::before {
  content: '';
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--ac2);
  border-radius: 2px;
  box-shadow: 0 0 6px rgba(120, 53, 15, 0.3);
}

.mu { color: var(--mu); font-size: 15px; }

/* Sticky Floating Bottom Navigation Bar */
nav {
  display: flex;
  gap: 4px;
  padding: 6px;
  background: rgba(251, 248, 243, 0.88);
  border: 1px solid rgba(180, 83, 9, 0.18);
  border-radius: 24px;
  overflow-x: auto;
  position: fixed;
  bottom: max(16px, env(safe-area-inset-bottom, 16px));
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 680px;
  z-index: 100;
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  box-shadow: 0 16px 32px rgba(61, 43, 31, 0.15), 0 2px 6px rgba(255, 255, 255, 0.8) inset;
}
nav::-webkit-scrollbar { display: none; }

nav .thumb, nav .hv {
  position: absolute;
  top: 6px;
  bottom: 6px;
  left: 0;
  width: 0;
  border-radius: 18px;
  pointer-events: none;
}
nav .thumb {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  box-shadow: 0 4px 14px rgba(120, 53, 15, 0.3);
  z-index: 1;
}
nav.ready .thumb {
  transition: transform .4s cubic-bezier(.34, 1.4, .5, 1), width .4s cubic-bezier(.34, 1.4, .5, 1);
}
nav .hv {
  background: rgba(180, 83, 9, 0.08);
  opacity: 0;
  z-index: 0;
  transition: transform .3s cubic-bezier(.3, 1.2, .5, 1), width .3s cubic-bezier(.3, 1.2, .5, 1), opacity .2s;
}
nav button {
  position: relative;
  z-index: 2;
  flex: 1;
  font-family: inherit;
  font-weight: 600;
  font-size: 13px;
  padding: 10px 14px;
  border: 0;
  background: none;
  color: var(--mu);
  cursor: pointer;
  border-radius: 18px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: color 0.2s, transform 0.2s;
  touch-action: manipulation;
}
nav button .nav-icon {
  font-size: 15px;
  opacity: 0.85;
}
@media (hover: hover) {
  nav button:hover { color: var(--ink); }
}
nav button.on { color: #ffffff; font-weight: 700; }
nav.many button { padding: 10px 9px; font-size: 12px; gap: 4px; }
nav button.on .nav-icon { opacity: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }

/* Cards & Containers */
.card {
  background: var(--card);
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: var(--shadow);
  transition: border-color 0.2s, box-shadow 0.2s;
}

/* Forms & Inputs */
label {
  display: block;
  font-weight: 600;
  margin: 0 0 8px;
  font-size: 14px;
  color: var(--ink);
}
input[type=text], textarea, select {
  width: 100%;
  font-family: inherit;
  font-size: 15px;
  padding: 12px 16px;
  border: 1.5px solid var(--card-border);
  border-radius: 12px;
  background: #faf6f0;
  color: var(--ink);
  transition: border-color 0.2s, box-shadow 0.2s;
}
textarea { min-height: 95px; resize: vertical; }
input[type=text]:focus, textarea:focus, select:focus {
  outline: 0;
  border-color: var(--ac);
  background: #ffffff;
  box-shadow: 0 0 0 3px var(--ac-glow);
}
::placeholder { color: #a38f7d; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: inherit;
  font-weight: 600;
  font-size: 14px;
  background: #f0e6d8;
  color: var(--ink);
  border: 1.5px solid #d9ccb9;
  border-radius: 12px;
  padding: 10px 20px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  touch-action: manipulation;
}
.btn:hover {
  border-color: var(--ac);
  color: var(--ac);
  background: #fbf5eb;
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}
.btn:active { transform: translateY(1px) scale(0.98); }
.btn.a {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #ffffff;
  border: none;
  box-shadow: 0 4px 16px rgba(120, 53, 15, 0.25);
}
.btn.a:hover {
  filter: brightness(1.08);
  color: #ffffff;
  box-shadow: 0 6px 20px rgba(120, 53, 15, 0.35);
}

/* Code & Pre */
code {
  background: #f3ebd8;
  color: var(--ac2);
  border: 1px solid #e5d3b8;
  border-radius: 6px;
  padding: 2px 6px;
  font-size: 0.88em;
  font-weight: 500;
}
pre {
  background: #2b1d14;
  color: #f7f1e5;
  border-left: 4px solid var(--ac);
  padding: 16px 18px;
  border-radius: 12px;
  overflow-x: auto;
  font-size: 14px;
  line-height: 1.6;
  margin: 14px 0 18px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
  border-top: 1px solid #3d2b1f;
  border-right: 1px solid #3d2b1f;
  border-bottom: 1px solid #3d2b1f;
}
pre code { background: none; color: #f7f1e5; padding: 0; border: none; }

/* Accordion (Details) */
details {
  background: var(--card);
  border: 1.5px solid var(--card-border);
  border-radius: 16px;
  margin: 12px 0;
  padding: 0 20px;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
summary {
  cursor: pointer;
  font-weight: 700;
  padding: 16px 0;
  font-size: 16px;
  color: var(--ink);
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  touch-action: manipulation;
}
summary::-webkit-details-marker { display: none; }
summary::after {
  content: '›';
  font-size: 22px;
  color: var(--mu);
  transition: transform 0.2s;
}
details[open] summary::after { transform: rotate(90deg); color: var(--ac); }
details[open] {
  border-color: rgba(180, 83, 9, 0.4);
  box-shadow: var(--shadow);
}
details[open] summary { color: var(--ac); border-bottom: 1px solid var(--ln); margin-bottom: 14px; }
details p { margin: 0 0 14px; }

/* Test / Quiz Options */
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 15px;
  padding: 14px 18px;
  margin: 10px 0;
  border: 1.5px solid var(--card-border);
  background: #faf6f0;
  color: var(--ink);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s;
  touch-action: manipulation;
}
.opt:hover {
  border-color: var(--ac);
  background: #fcf6ed;
}
.opt.sel {
  border-color: var(--ac);
  box-shadow: 0 0 0 3px var(--ac-glow);
  background: #fbf0df;
  color: var(--ac2);
  font-weight: 600;
}
.opt.r { background: var(--ok); border-color: var(--ok-border); color: #047857; font-weight: 600; }
.opt.w { background: var(--bad); border-color: var(--bad-border); color: #b91c1c; }
.score { font-size: 32px; font-weight: 800; color: var(--ac2); }

/* Reactions */
.reacts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.react {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding: 18px 8px 16px;
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  background: #faf6f0;
  cursor: pointer;
  font: inherit;
  color: var(--ink);
  min-height: 120px;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  touch-action: manipulation;
}
.reacts.has .react:not(.on) { opacity: 0.45; filter: grayscale(0.3); }
@media (hover: hover) {
  .react:hover { transform: translateY(-3px); border-color: var(--ac); box-shadow: var(--shadow); }
  .reacts.has .react:not(.on):hover { opacity: 1; filter: none; }
}
.react .e {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 56px;
  font-size: 38px;
  transition: font-size 0.3s cubic-bezier(.34,1.56,.5,1);
}
.react .l { font-weight: 600; font-size: 13px; color: var(--mu); }
.react.on {
  transform: scale(1.04);
  border-color: var(--ac);
  background: linear-gradient(180deg, #fbf0df, #faf3e8);
  box-shadow: 0 0 0 3px var(--ac-glow);
}
.react.on .l { color: var(--ac2); font-weight: 700; }
.react.on .e { font-size: 52px; animation: bob 2.4s ease-in-out infinite; }
.react .e.pop { animation: pop .7s cubic-bezier(.34,1.56,.5,1); }

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.5) rotate(-8deg)}70%{transform:scale(.92) rotate(4deg)}100%{transform:scale(1)}}
.pt { position: absolute; left: 50%; top: 34%; pointer-events: none; z-index: 6; opacity: 0; animation: fly 1.2s ease-out forwards; }
@keyframes fly{0%{opacity:1;transform:translate(-50%,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--r)) scale(1.1)}}

/* Chips & Progress Bars */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-family: inherit;
  font-weight: 600;
  font-size: 14px;
  padding: 8px 16px;
  border: 1.5px solid var(--card-border);
  border-radius: 99px;
  background: #faf6f0;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s;
  touch-action: manipulation;
}
.chip:hover { border-color: var(--ac); color: var(--ac); background: #ffffff; }
.chip.on {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(120, 53, 15, 0.25);
}

.bar {
  height: 8px;
  background: #ebdcc9;
  border-radius: 99px;
  overflow: hidden;
  margin: 12px 0 6px;
}
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ac), var(--ac2)); transition: width .4s cubic-bezier(0.2, 0.8, 0.2, 1); }

/* Results & Gauge Ring */
.res {
  display: flex;
  flex-wrap: wrap;
  gap: 24px 32px;
  align-items: center;
  background: var(--card);
  border: 1.5px solid var(--card-border);
  border-radius: 20px;
  padding: 24px;
  animation: rise .5s cubic-bezier(.2,.9,.3,1) both;
  box-shadow: var(--shadow-lg);
}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.rcol { flex: 0 0 auto; margin: 0 auto; text-align: center; }
.ringw { position: relative; width: 160px; height: 160px; margin: 0 auto; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 10; }
.ring .bg { stroke: #ebdcc9; }
.ring .fg {
  stroke: var(--ac);
  stroke-linecap: round;
  stroke-dasharray: 100 100;
  stroke-dashoffset: 100;
  opacity: 0;
  transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1), stroke .5s, opacity .3s;
}
.ringc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ringc b { font-size: 42px; line-height: 1; transition: color .5s; font-weight: 800; }
.ringc span { font-size: 13px; font-weight: 600; color: var(--mu); margin-top: 2px; }
.rlvl { margin-top: 10px; font-weight: 700; font-size: 16px; transition: color .5s; min-height: 24px; }
.rrows { flex: 1; min-width: 240px; }
.rrow { padding: 8px 0; border-bottom: 1px dashed var(--ln); }
.rrow.sub { border-bottom: 0; }
.rh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 14px; }
.rv { font-style: normal; }
.rb { height: 7px; border-radius: 99px; background: #ebdcc9; overflow: hidden; margin-top: 6px; }
.rb i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--ac), var(--ac2)); transition: width 1s cubic-bezier(.2,.8,.2,1); }

/* Task / Code Editor Page */
.ck { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--ln); }
.ck:last-child { border-bottom: 0; }
.ck i {
  flex: none; width: 22px; height: 22px; border: 1.5px solid var(--card-border); border-radius: 6px;
  display: grid; place-items: center; font-style: normal; font-size: 13px; background: #faf6f0; color: transparent;
}
.ck.ok i { background: var(--g); border-color: var(--g); color: #fff; font-weight: 800; }
.ck.ok span { color: var(--mu); text-decoration: line-through; }

.mchip {
  display: flex; gap: 8px; align-items: center; border: 1.5px solid var(--card-border); border-radius: 12px; padding: 6px 8px 6px 12px; margin: 8px 0 0; background: #faf6f0;
}
.mchip span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
#code {
  min-height: 260px; font-size: 14px; line-height: 1.55; white-space: pre; overflow: auto; tab-size: 2;
  background: #2b1d14; color: #a7f3d0; border-radius: 14px; padding: 14px; border: 1.5px solid #3d2b1f;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
}
.pv { display: block; width: 100%; height: 380px; border: 1.5px solid var(--card-border); border-radius: 14px; background: #ffffff; box-shadow: var(--shadow); }

/* Status Badges */
.tag { display: inline-block; font-weight: 600; font-size: 12px; background: var(--ok); color: #047857; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--ok-border); }
.x { border: 0; background: none; color: var(--mu); font-size: 18px; cursor: pointer; padding: 2px 8px; border-radius: 6px; }
.x:hover { background: var(--bad); color: #dc2626; }
.fl { position: relative; overflow: hidden; display: inline-flex; margin: 0 8px 8px 0; }
.fl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

/* Journal & Tables */
table { color: var(--ink); border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; }
th { font-weight: 700; color: var(--mu); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }

.st.done { display: inline-flex; align-items: center; gap: 6px; color: #047857; font-weight: 700; background: var(--ok); padding: 6px 14px; border-radius: 99px; border: 1px solid var(--ok-border); }
.chk { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--g); color: #fff; font-weight: 800; font-size: 11px; }

/* Responsive adjustments */
@media (max-width: 520px) {
  .wrap { padding: 0 14px 105px; }
  nav { width: calc(100% - 20px); bottom: max(10px, env(safe-area-inset-bottom, 10px)); gap: 2px; padding: 4px; border-radius: 20px; }
  nav button { padding: 8px 4px; font-size: 11px; gap: 3px; }
  nav button .nav-icon { font-size: 13px; }
  .card, .res { padding: 16px; border-radius: 16px; }
  .ringw { width: 130px; height: 130px; }
  .ringc b { font-size: 34px; }
}

.shots{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.shots img{max-width:100%;max-height:340px;border-radius:12px;border:1px solid var(--card-border);display:block;background:#fff}
.vids{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.vid iframe,.vid video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;display:block}
.lks{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.lk{color:var(--ac);font-weight:600;text-decoration:none;word-break:break-word}
.lk:hover{text-decoration:underline}
.medbox input[type=file]{display:none}
.medbox .mchip{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">Lesson<b>Board</b></div>
  </header>
  <main id="v"></main>
  <nav id="nav"></nav>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
